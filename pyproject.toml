[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-kv"
version = "0.1.0"
description = "Deterministic simulation testing for LLM-serving KV caches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sameer Ahmed" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phantomkv = "phantomkv.cli:main"

[tool.setuptools]
packages = ["phantomkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
