name: real-vllm

# Runs Phantom inside real vLLM (CPU build, pinned commit) on GitHub's Linux
# runners: unmodified vLLM must be clean and deterministic, and a planted
# block-pool bug must be caught.

on:
  push:
    branches: [main]
    paths:
      - "phantomkv/**"
      - "scripts/**"
      - ".github/workflows/vllm.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "phantomkv/**"
      - "scripts/**"
      - ".github/workflows/vllm.yml"
      - "pyproject.toml"
  workflow_dispatch:

env:
  # Development pin is 0e5b2ba118 (docs/VLLM_INTEGRATION.md), which has no
  # published CPU wheel. CI uses its parent, 76c6f3f2a (0.33.0rc1.dev484): the
  # only difference is vllm/model_executor/models/mimo_v2_omni.py (+ its test
  # and CI config), none of which Phantom touches. Pinned to the exact file,
  # because the "nightly" index moves.
  VLLM_WHEEL: https://wheels.vllm.ai/76c6f3f2a95f6049657db1e513133b824a5c8175/vllm-0.33.0rc1.dev484%2Bg76c6f3f2a.cpu-cp38-abi3-manylinux_2_39_x86_64.whl
  PHANTOM_CI_SEEDS: "10"

jobs:
  phantom-in-vllm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Runner CPU (the vLLM CPU wheel needs AVX-512; GitHub runners vary)
        run: |
          grep -m1 "model name" /proc/cpuinfo
          if grep -qw avx512f /proc/cpuinfo; then
            echo "AVX-512: yes"
          else
            echo "::warning::This runner's CPU has no AVX-512. The vLLM CPU wheel may die with 'Illegal instruction'; that is the runner, not Phantom. Re-run the job."
          fi

      - name: Install vLLM (pinned CPU wheel)
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install "vllm @ ${VLLM_WHEEL}" --torch-backend cpu
          uv pip install -e .
          python -c "import vllm; print('vLLM', vllm.__version__)"

      - name: Preload tcmalloc and Intel OpenMP (required by vLLM CPU wheels)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libtcmalloc-minimal4
          TC=$(find /usr/lib -name 'libtcmalloc_minimal.so.4' | head -1)
          IOMP=$(find .venv -name 'libiomp5.so' | head -1)
          echo "tcmalloc: $TC"; echo "iomp5: $IOMP"
          echo "LD_PRELOAD=${TC}${IOMP:+:$IOMP}" >> "$GITHUB_ENV"

      - name: Phantom acceptance checks against real vLLM
        run: |
          source .venv/bin/activate
          bash scripts/ci_vllm.sh
