# Publish to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OpenID Connect): no API token is stored.
# One-time setup on pypi.org: a (pending) publisher for project phantom-kv,
# owner sameer-sde, repository phantom-kv, workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version must match the release tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version $version, release tag ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build twine pytest
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
